<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Vitpepper Academy">
<meta property="og:description" content="Yeni Biberlere, Temel Bilgiler.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://vitpepperacademy.com/">
<meta name="theme-color" content="#141112">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="canonical" href="https://vitpepperacademy.com/">
<style>[hidden]{display:none!important} img{max-width:100%} html,body{margin:0}</style>
<title>Vitpepper Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dark screening-room page. Narrow reading column, one red accent, cream type.
   Home = slogan + three "alan" doors. Alan = numbered lesson list. Ders = video slot + notes.
   Editors get an edit mode: inline controls on the area page and a dialog form for lessons. */
:root{
  --bg:#141112;
  --bg-2:#1d1819;
  --bg-3:#262021;
  --line:#2f2728;
  --fg:#efe6d6;
  --fg-2:#bfaf95;
  --muted:#8a7d6c;
  --red:#ae262d;
  --red-2:#d2343c;
  --cream:#bfaf95;
  --ok:#5c8a52;
  --font-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --font-body:"Figtree","Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3eee4; --bg-2:#e9e2d4; --bg-3:#ddd4c3; --line:#d6ccb9;
    --fg:#1b1516; --fg-2:#5a4d41; --muted:#8a7d6c;
    --red:#ae262d; --red-2:#8f1f25; --cream:#7a6d59; --ok:#3f6b37;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3eee4; --bg-2:#e9e2d4; --bg-3:#ddd4c3; --line:#d6ccb9;
  --fg:#1b1516; --fg-2:#5a4d41; --muted:#8a7d6c;
  --red:#ae262d; --red-2:#8f1f25; --cream:#7a6d59; --ok:#3f6b37;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important;animation:none!important} }
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--font-body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--red-2);outline-offset:3px;border-radius:2px}
.wrap{
  max-width:1080px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.05}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
button{font-family:inherit;cursor:pointer}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand .mark{width:34px;height:34px;flex:0 0 34px}
.brand em{font-style:normal;font-weight:400;color:var(--cream);letter-spacing:.12em;font-size:12px;margin-left:2px}
nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
nav a{font-size:14px;font-weight:500;color:var(--fg-2);padding:6px 10px;border-radius:999px}
nav a:hover{color:var(--fg);background:var(--bg-2)}
nav a[aria-current="page"]{color:var(--fg);background:var(--bg-2)}
nav a.soon{color:var(--muted);cursor:default}
nav a.soon:hover{background:transparent;color:var(--muted)}
nav a.soon small{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--red-2);margin-left:4px}
.edit-toggle{margin-left:8px;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg-2);display:inline-flex;align-items:center;gap:8px}
.edit-toggle:hover{background:var(--bg-2);color:var(--fg)}
.edit-toggle .led{width:8px;height:8px;border-radius:50%;background:var(--muted)}
body.editing .edit-toggle{border-color:var(--red);color:var(--fg)}
body.editing .edit-toggle .led{background:var(--red-2);animation:pulse 1.6s ease-in-out infinite}
.edit-banner{display:none;background:var(--red);color:#fff;font-size:13px;font-weight:500}
.edit-banner .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:8px;flex-wrap:wrap}
.edit-banner b{font-family:var(--font-mono);font-weight:500;letter-spacing:.1em;font-size:11px;text-transform:uppercase}
body.editing .edit-banner{display:block}

/* views */
.view{display:none}
.view.active{display:block}
main{padding-block:48px 72px}
@media (max-width:600px){ main{padding-block:32px 56px} body{font-size:16px} }

/* HOME */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end;padding-bottom:40px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(44px,8vw,104px);font-weight:800;letter-spacing:-.03em;line-height:.95}
.hero h1 span{color:var(--red-2);display:block}
.hero p{font-size:19px;color:var(--fg-2);max-width:34ch;margin:0}
.hero .intro{display:grid;gap:18px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;font-weight:600;font-size:15px;padding:12px 18px;border-radius:999px;border:0;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:var(--red-2)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg-2)}
.btn.sm{font-size:13px;padding:8px 14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
@media (max-width:760px){ .hero{grid-template-columns:1fr;align-items:start} }

.areas{padding-block:40px}
.areas h2{font-size:28px;font-weight:600;letter-spacing:-.01em;margin-bottom:22px}
.area-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
@media (max-width:560px){ .area-grid{grid-template-columns:1fr} }
.area-card{background:var(--bg);padding:20px 20px 22px;display:grid;grid-template-rows:auto auto auto;gap:16px;position:relative;transition:background .15s}
.area-card:hover{background:var(--bg-2)}
.area-card .cover{aspect-ratio:4/3;max-width:100%;background:var(--bg-2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative;transition:border-color .2s}
.area-card:hover .cover{border-color:var(--red)}
.area-card .cover::before{content:"";position:absolute;inset:0;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 24px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/24px 100%;opacity:.35}
.area-card .cover svg{position:relative;width:70%;height:70%;max-width:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.area-card:hover .cover svg{transform:translateY(-4px) scale(1.04)}
.area-card .cover .tag{position:absolute;top:12px;left:12px;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--red-2)}
.area-card .cover .tag2{position:absolute;bottom:10px;right:12px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.area-card .ttl{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.area-card h3{font-size:28px;font-weight:800;letter-spacing:-.02em}
.area-card .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
.area-card .meta b{color:var(--fg);font-weight:500}
.arrow{width:22px;height:22px;transition:transform .15s}
.area-card:hover .arrow{transform:translateX(4px)}
/* "yakında" kartları */
.area-card.is-soon{cursor:default}
.area-card.is-soon:hover{background:var(--bg)}
.area-card.is-soon:hover .cover{border-color:var(--line)}
.area-card.is-soon:hover .cover svg{transform:none}
.area-card.is-soon .cover svg{opacity:.55;filter:saturate(.6)}
.area-card.is-soon h3{color:var(--fg-2)}
.area-card.is-soon .soon-badge{position:absolute;right:12px;bottom:10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--red);padding:5px 10px;border-radius:999px}
.area-card.is-soon .meta .dot{width:8px;height:8px;border-radius:50%;background:var(--red-2);animation:pulse 1.6s ease-in-out infinite}
body.editing .area-card.is-soon{cursor:pointer}
body.editing .area-card.is-soon:hover{background:var(--bg-2)}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* oryantasyon kapak */
.area-card .cmp-needle{transform-origin:120px 90px;animation:needle 7s ease-in-out infinite}
.area-card:hover .cmp-needle{animation-duration:2.5s}
@keyframes needle{0%{transform:rotate(-18deg)}30%{transform:rotate(14deg)}55%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}100%{transform:rotate(-18deg)}}
/* kapak animasyonları — her zaman çalışır */
.area-card .lens-iris{transform-origin:50% 50%;animation:iris 14s linear infinite}
.area-card:hover .lens-iris{animation-duration:3s}
@keyframes iris{to{transform:rotate(360deg)}}
.area-card .lens-ring{transform-origin:50% 50%;animation:iris 40s linear infinite reverse}
.area-card .lens-core{transform-origin:50% 50%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.area-card .arc-line{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.6s cubic-bezier(.3,.7,.2,1) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.area-card .arc-fill{opacity:0;animation:fadein 1.2s ease 2.2s forwards}
@keyframes fadein{to{opacity:.12}}
.area-card .arc-dot{transform-origin:160px 44px;animation:dotpulse 1.8s ease-in-out 2.4s infinite}
@keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.area-card .arc-halo{transform-origin:160px 44px;opacity:0;animation:halo 1.8s ease-out 2.4s infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.6}100%{transform:scale(2.4);opacity:0}}
.area-card .cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.area-card .type{transform-origin:0 50%;animation:typeline 5.5s ease-in-out infinite}
.area-card .type.t2{animation-delay:.25s}.area-card .type.t3{animation-delay:.5s}
.area-card .type.t4{animation-delay:.9s}.area-card .type.t5{animation-delay:1.15s}.area-card .type.t6{animation-delay:1.4s}
.area-card .type.t7{animation-delay:1.9s}.area-card .type.t8{animation-delay:2.15s}
@keyframes typeline{0%{transform:scaleX(0)}12%{transform:scaleX(0)}40%{transform:scaleX(1)}85%{transform:scaleX(1)}100%{transform:scaleX(1)}}
.area-card .page-back{animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}

.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding-block:40px;border-top:1px solid var(--line)}
@media (max-width:820px){ .how{grid-template-columns:1fr;gap:20px} }
.how h3{font-size:18px;font-weight:600;margin-bottom:6px}
.how p{margin:0;color:var(--fg-2);font-size:15px}

/* AREA */
.area-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--line)}
.area-head h1{font-size:clamp(40px,6vw,76px);font-weight:800;letter-spacing:-.03em}
.area-head p{color:var(--fg-2);max-width:60ch;margin:10px 0 0;font-size:17px}
.area-head .count{font-family:var(--font-mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.area-head .count b{display:block;font-size:40px;color:var(--fg);font-weight:500;line-height:1}
.area-head .soon-pill{display:inline-block;margin-left:12px;vertical-align:middle;font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--red);padding:5px 10px;border-radius:999px}
@media (max-width:600px){ .area-head{grid-template-columns:1fr} .area-head .count{text-align:left} }
.edit-tools{display:none;gap:10px;flex-wrap:wrap;margin-top:18px}
body.editing .edit-tools{display:flex}
.lessons{list-style:none;margin:0;padding:0}
.lesson-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:18px;align-items:center;padding:20px 8px;border-bottom:1px solid var(--line);transition:background .12s}
.lesson-row:hover{background:var(--bg-2)}
.lesson-row .n{font-family:var(--font-mono);font-size:14px;color:var(--red-2);font-variant-numeric:tabular-nums}
.lesson-row h3{font-size:20px;font-weight:600;letter-spacing:-.01em}
.lesson-row p{margin:4px 0 0;color:var(--fg-2);font-size:15px}
.lesson-row .dur{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px}
.lesson-row .pill{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.lesson-row .pill.vid{color:var(--ok);border-color:var(--ok)}
.lesson-row .pill.novid{color:var(--red-2);border-color:var(--red)}
@media (max-width:600px){ .lesson-row{grid-template-columns:40px minmax(0,1fr)} .lesson-row .dur{grid-column:2;justify-content:flex-start} }
.row-tools{display:none;gap:4px;align-items:center;margin-left:12px}
body.editing .row-tools{display:inline-flex}
.icon-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg-2);display:grid;place-items:center;font-size:13px}
.icon-btn:hover{background:var(--bg-3);color:var(--fg)}
.icon-btn[disabled]{opacity:.3;cursor:default}
.icon-btn svg{width:15px;height:15px}
.add-row{display:none;margin-top:18px}
body.editing .add-row{display:block}
.empty{padding:40px 8px;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}

/* LESSON */
.crumbs{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumbs a:hover{color:var(--fg)}
.lesson-head{margin-top:14px;display:grid;gap:8px}
.lesson-head .n{font-family:var(--font-mono);font-size:13px;color:var(--red-2);letter-spacing:.1em}
.lesson-head h1{font-size:clamp(32px,5vw,56px);font-weight:800;letter-spacing:-.025em}
.player{margin-top:26px;position:relative;aspect-ratio:16/9;max-width:100%;background:#0a0809;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.player::before{content:"";position:absolute;inset:0;background:
  radial-gradient(60% 70% at 50% 50%,rgba(174,38,45,.22),transparent 70%),
  repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.015) 3px 4px)}
.player .slate{position:relative;z-index:1;display:grid;justify-items:center;gap:14px;text-align:center;color:#efe6d6;padding:16px}
.player .slate .play{width:76px;height:76px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 10px 40px rgba(174,38,45,.35)}
.player .slate .play svg{width:28px;height:28px;margin-left:4px}
.player .slate .t{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#bfaf95}
.player .slate .s{font-size:14px;color:#8a7d6c;max-width:40ch}
.player .slate a.btn{font-size:14px;padding:10px 16px}
.player .tc{position:absolute;left:14px;bottom:12px;font-family:var(--font-mono);font-size:12px;color:#8a7d6c;z-index:1}
.player .tc2{position:absolute;right:14px;top:12px;font-family:var(--font-mono);font-size:12px;color:#8a7d6c;z-index:1}
.player video,.player iframe.embed{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;background:#000;border:0}
.lesson-body{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;margin-top:36px}
@media (max-width:820px){ .lesson-body{grid-template-columns:1fr;gap:28px} }
.lesson-body h2{font-size:22px;font-weight:600;margin-bottom:12px}
.lesson-body p{max-width:65ch;color:var(--fg-2);margin:0 0 14px}
.lesson-body ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.lesson-body li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;color:var(--fg-2);font-size:15.5px}
.lesson-body li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red-2);margin-top:9px}
.aside{display:grid;gap:22px;align-content:start}
.aside .box{border:1px solid var(--line);padding:18px 20px}
.aside .box h2{font-size:14px;font-family:var(--font-mono);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.aside .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:14.5px}
.aside .kv span:nth-child(odd){color:var(--muted)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:48px}
.pager a,.pager div{background:var(--bg);padding:18px 20px;display:grid;gap:4px;min-height:84px}
.pager a:hover{background:var(--bg-2)}
.pager .lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pager .tt{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.pager .next{text-align:right}
@media (max-width:480px){ .pager{grid-template-columns:1fr} .pager .next{text-align:left} }

/* DIALOG / FORM */
dialog{border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0;width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 32px);border-radius:4px}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(2px)}
dialog .dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
dialog .dhead h2{font-size:20px;font-weight:600}
dialog .dbody{padding:20px 22px;display:grid;gap:16px;overflow:auto;max-height:calc(100vh - 32px - 140px)}
dialog .dfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
dialog .dfoot .right{display:flex;gap:8px;margin-left:auto}
.field{display:grid;gap:6px}
.field label{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{font-family:inherit;font-size:15px;color:var(--fg);background:var(--bg-2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
.field textarea{min-height:84px;resize:vertical;line-height:1.5}
.field .hint{font-size:12.5px;color:var(--muted)}
.field.mono input{font-family:var(--font-mono);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){ .row2{grid-template-columns:1fr} }
.video-box{border:1px dashed var(--line);padding:14px;display:grid;gap:10px;border-radius:4px}
.video-box .status{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
.video-box .status .ok{color:var(--ok)}
.video-box .status .none{color:var(--muted)}
.video-box .or{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-align:center}
.video-box input[type=file]{font-size:13px;color:var(--fg-2)}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--red)}
.danger{color:var(--red-2);background:transparent;border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600}
.danger:hover{border-color:var(--red)}
.danger.armed{background:var(--red);color:#fff;border-color:var(--red)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:40%;background:var(--red-2);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:20;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red);color:#fff}

footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:13.5px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer .mail{font-family:var(--font-mono);color:var(--fg-2)}
</style>
</head>
<body>
<style>
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#gate .card{display:grid;justify-items:center;gap:26px;width:min(360px,100%)}
#gate .logo{display:grid;justify-items:center;gap:10px}
#gate .logo svg{width:96px;height:96px}
#gate .logo .wm{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
#gate .logo .wm em{font-style:normal;font-weight:400;color:var(--cream);letter-spacing:.14em;font-size:12px;margin-left:4px}
#gate form{display:grid;gap:10px;width:100%}
#gate input{font-family:var(--font-mono);font-size:18px;letter-spacing:.2em;text-align:center;color:var(--fg);background:var(--bg-2);border:1px solid var(--line);border-radius:4px;padding:14px 16px;width:100%}
#gate input:focus{outline:none;border-color:var(--red)}
#gate button{font-family:var(--font-body);font-weight:600;font-size:15px;color:#fff;background:var(--red);border:0;border-radius:999px;padding:13px 18px;cursor:pointer}
#gate button:hover{background:var(--red-2)}
#gate .msg{font-size:13px;color:var(--muted);text-align:center;min-height:1.4em}
#gate.err .card{animation:shake .4s}
#gate.err .msg{color:var(--red-2)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
<div id="gate">
  <div class="card">

    <polygon points="46,8 74,19 46,30 18,19" fill="#BFAF95"/>
    <circle cx="46" cy="18.5" r="2.2" fill="#8F8168"/>

    <path d="M46 18.5 C58 17 69 18 72 22 L73.5 36" fill="none" stroke="#8F8168" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M70.5 35.5 L76.5 35.5 L77.5 46 L69.5 46 Z" fill="#BFAF95"/>

  </g>
</g></svg><div class="wm">vitpepper<em>ACADEMY</em></div></div>
    <form id="gate-form" autocomplete="off">
      <input id="gate-pass" type="password" inputmode="numeric" placeholder="password" aria-label="Password" autofocus>
      <button type="submit">Giriş</button>
      <div class="msg" id="gate-msg"></div>
    </form>
  </div>
</div>

  const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function unlock(pw){
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b2a(SALT), iterations:ITER, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b2a(IV)}, key, b2a(CT));
    return new TextDecoder().decode(plain);
  }
  function mount(html){
    const tpl = document.createElement("template"); tpl.innerHTML = html;
    const frag = tpl.content; const scripts = [...frag.querySelectorAll("script")];
    scripts.forEach(s => s.remove());
    document.getElementById("gate").remove();
    document.body.appendChild(frag);
    scripts.forEach(s => { const n = document.createElement("script"); n.textContent = s.textContent; document.body.appendChild(n); });
  }
  const form = document.getElementById("gate-form"), inp = document.getElementById("gate-pass"), msg = document.getElementById("gate-msg"), gate = document.getElementById("gate");
  async function tryPw(pw, silent){
    try { const html = await unlock(pw); try { sessionStorage.setItem("vpa-key", pw); } catch(e){} mount(html); }
    catch(e) { if (silent) return; gate.classList.remove("err"); void gate.offsetWidth; gate.classList.add("err"); msg.textContent = "Yanlış şifre"; inp.value = ""; inp.focus(); }
  }
  form.addEventListener("submit", e => { e.preventDefault(); msg.textContent = ""; tryPw(inp.value, false); });
  try { const saved = sessionStorage.getItem("vpa-key"); if (saved) tryPw(saved, true); } catch(e){}
})();
